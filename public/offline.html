<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#191613" />
    <meta name="color-scheme" content="dark" />
    <title>Offline · ShelfSprite</title>
    <!--
      Shown by the service worker when a page can't be reached. It is self-contained on purpose:
      no Next.js chunks, fonts or images it would have to find in a cache, and no user data.
    -->
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #191613;
        color: #f5f0e8;
        font-family:
          Inter,
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        box-sizing: border-box;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px 16px;
        text-align: center;
      }
      svg {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 8px 0 0;
        font-size: 1.5rem;
        font-weight: 700;
      }
      p {
        margin: 0;
        max-width: 28rem;
        color: #b7ab9c;
        line-height: 1.5;
      }
      button {
        margin-top: 8px;
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 999px;
        background: #ff7959;
        color: #191613;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #ff9075;
      }
      button:focus-visible {
        outline: 2px solid #ff7959;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="12" fill="#161412" />
        <path
          d="M32 8c-6 4-9 9-9 15-4 2-6 6-6 10 0 7 6 12 15 12s15-5 15-12c0-4-2-8-6-10 0-6-3-11-9-15Z"
          fill="#ff5c3a"
        />
        <path d="M21 31c0-6 5-10 11-10s11 4 11 10-5 9-11 9-11-3-11-9Z" fill="#161412" />
        <circle cx="27" cy="30" r="3" fill="#f5f0e8" />
        <circle cx="37" cy="30" r="3" fill="#f5f0e8" />
        <path d="M5 36c9-2 18 0 27 7v14C23 51 14 49 5 51V36Z" fill="#ff5c3a" />
        <path d="M59 36c-9-2-18 0-27 7v14c9-6 18-8 27-6V36Z" fill="#ff7355" />
      </svg>
      <h1>You're offline</h1>
      <p>ShelfSprite needs a connection to load your shelves. Check your signal and try again.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', () => location.reload());
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
